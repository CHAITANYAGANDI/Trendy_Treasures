<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Trendy Treasures">
  <!-- Kept in step with client/src/components/BrandMark.js. Same geometry,
       static gradient ids (nothing else shares this document). -->
  <defs>
    <linearGradient id="ttTile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf2"/>
    </linearGradient>
    <linearGradient id="ttDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#414b57"/>
      <stop offset="1" stop-color="#1e252e"/>
    </linearGradient>
    <linearGradient id="ttBlue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#cbdcef"/>
      <stop offset="0.45" stop-color="#8fb4dc"/>
      <stop offset="1" stop-color="#5d93c9"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.5" fill="url(#ttTile)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.5" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5"/>

  <g fill="url(#ttDark)">
    <rect x="5" y="5" width="18.5" height="10" rx="5"/>
    <rect x="11.5" y="5" width="13.5" height="32.5" rx="6.75"/>
  </g>

  <g fill="#eef2f7">
    <rect x="15.5" y="8" width="29" height="16" rx="8"/>
    <rect x="15.5" y="8" width="17" height="37" rx="8.5"/>
  </g>

  <g fill="url(#ttBlue)">
    <rect x="17.5" y="10" width="25.5" height="12" rx="6"/>
    <rect x="17.5" y="10" width="13" height="33" rx="6.5"/>
  </g>
</svg>
